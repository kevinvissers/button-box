<!DOCTYPE html>
<html data-bs-theme="dark">

<head>
    <title>Remote Keyboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        nav {
            margin-bottom: 20px;
        }

        /* spacing between rows */
        .gut {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        /* Dry Run button warning color */
        .form-check-input:checked {
            background-color: #ffc107;
            border-color: #fd810d;
        }

        .form-check-input:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 .25rem rgba(255, 193, 7, .25);
        }

        {% block css %}{% endblock %}

    </style>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary"">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">ButtonBox</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    {% for item in navigation %}
                        <a class="nav-link {% if item.active == 'true' %}active{% endif %}" {% if item.active == "true" %} aria-current="page" {% endif %} href="{{ item.href }}">{{ item.caption }}</a>
                    {% endfor %}
                </div>
            </div>
            <div class="form-check form-switch">
                <label class="form-check-label" for="dryrun"><i class="bi bi-activity"></i></label>
                <input class="form-check-input" type="checkbox" role="switch" id="dryrun" checked onchange="toggleDryRun();">
            </div>
        </div>
    </nav>
    <!-- / NAVBAR -->
     <div class="container-fluid">
        {% block content %}{% endblock %}
     </div>
    <script>
        function sendKey(key, duration=0) {
            fetch('/press', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key, duration: duration })
            });
            navigator.vibrate(50);
        };

        function toggleDryRun(){
            var value = document.getElementById("dryrun").checked;
            fetch('/dryrun', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ value: value })
            });
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
